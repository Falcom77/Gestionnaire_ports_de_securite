<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test Chargement</title>
</head>
<body>
    <h1>Test de chargement des données</h1>
    <div id="result"></div>
    <script>
        async function test() {
            try {
                const response = await fetch('data.json');
                const data = await response.json();
                document.getElementById('result').innerHTML = `
                    <p>✅ Chargement réussi!</p>
                    <p>Ports: ${data.ports.length}</p>
                    <p>Devices: ${data.devices.length}</p>
                    <p>Categories: ${data.categories.length}</p>
                `;
            } catch (error) {
                document.getElementById('result').innerHTML = `
                    <p>❌ Erreur: ${error.message}</p>
                `;
            }
        }
        test();
    </script>
</body>
</html>
