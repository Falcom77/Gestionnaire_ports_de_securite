function toggleTheme(){state.darkMode=!state.darkMode;document.body.classList.toggle('light-mode');render();}

function handleSort(k){let d='asc';if(state.sortConfig.key===k&&state.sortConfig.direction==='asc')d='desc';state.sortConfig={key:k,direction:d};render();}
function sortArray(a,k,d){if(!k)return a;return[...a].sort((x,y)=>{let av=x[k]||'',bv=y[k]||'';if(k==='ip_address'){const ipN=ip=>{const p=(ip||'0.0.0.0').split('/')[0].split('.');return p.reduce((c,o,i)=>c+(parseInt(o)||0)*Math.pow(256,3-i),0);};av=ipN(av);bv=ipN(bv);}else{av=String(av).toLowerCase();bv=String(bv).toLowerCase();}if(av<bv)return d==='asc'?-1:1;if(av>bv)return d==='asc'?1:-1;return 0;});}

function exportCSV(){let csv="Service,Port Interne,Port Externe,Protocole,Description,Catégorie,Actif\n";state.ports.forEach(p=>{csv+=`"${p.service}","${p.port_internal}","${p.port_external}","${p.protocol}","${p.description}","${p.category}","${p.is_active?'Oui':'Non'}"\n`;});dl(csv,'pfsense_ports.csv','text/csv');}

</span>Ajouter Périphérique</button>`:''}< button onclick="${state.activeTab==='ports'?'exportCSV()':'exportDev()'}" class="bg-gradient-to-r from-green-500 to-green-600 text-white px-4 py-2 rounded-lg flex items-center gap-2 shadow-lg"><span class="w-5 h-5">${icons.download}</span>Export CSV</button></div></div></div></header><div class="max-w-full mx-auto px-2 py-4"><div class="${d?'border-gray-700':'border-gray-200'} flex gap-4 border-b-2"><button onclick="toggleTab('ports')" class="px-6 py-3 font-semibold transition-all ${state.activeTab==='ports'?`border-b-4 ${d?'border-blue-500 text-blue-400':'border-blue-600 text-blue-600'}`:`${d?'text-gray-400':'text-gray-600'}`}">📋 Règles de Ports (${state.ports.length})</button><button onclick="toggleTab('devices')" class="px-6 py-3 font-semibold transition-all ${state.activeTab==='devices'?`border-b-4 ${d?'border-blue-500 text-blue-400':'border-blue-600 text-blue-600'}`:`${d?'text-gray-400':'text-gray-600'}`}">💻 Parc Informatique (${state.devices.length})</button></div></div><main class="max-w-full mx-auto px-2 py-4">${state.activeTab==='ports'?renderPorts(g,d):renderDevices(sD,d)}</main>`;}
function renderPorts(g,d){return Object.keys(g).sort().map(c=>{const grad=catColors[c]||"from-gray-500 to-gray-600",ports=g[c],icon=catIcons[c]||"📌";return`<div class="mb-8"><div class="bg-gradient-to-r ${grad} rounded-lg p-4 mb-4 shadow-xl flex justify-between items-center"><h2 class="text-2xl font-bold text-white flex items-center gap-3"><span class="text-3xl">${icon}</span>${c}<span class="text-sm font-normal opacity-80">(${ports.length} règles)</span></h2><button onclick="alert2('Supprimer ${c}')" class="bg-red-500/20 hover:bg-red-500/30 text-white p-2 rounded-lg" title="Supprimer catégorie"><span class="w-5 h-5 inline-block">${icons.trash}</span></button></div><div class="${d?'bg-gray-800/50 border-gray-700':'bg-gray-200/90 border-gray-400'} rounded-lg shadow-xl overflow-hidden border"><div class="overflow-x-auto"><table class="w-full"><thead class="${d?'bg-gray-900/50':'bg-gray-100'}"><tr><th class="${d?'text-gray-300':'text-gray-700'} px-2 py-3 text-left text-xs font-medium uppercase" style="width:75px">État</th><th class="${d?'text-gray-300':'text-gray-700'} px-2 py-3 text-center text-xs font-medium uppercase" style="width:60px">Icône</th><th class="${d?'text-gray-300':'text-gray-700'} px-2 py-3 text-left text-xs font-medium uppercase" style="width:180px">Service</th><th class="${d?'text-gray-300':'text-gray-700'} px-2 py-3 text-left text-xs font-medium uppercase" style="width:110px">Port Int.</th><th class="${d?'text-gray-300':'text-gray-700'} px-2 py-3 text-left text-xs font-medium uppercase" style="width:110px">Port Ext.</th><th class="${d?'text-gray-300':'text-gray-700'} px-2 py-3 text-left text-xs font-medium uppercase" style="width:90px">Proto</th><th class="${d?'text-gray-300':'text-gray-700'} px-2 py-3 text-left text-xs font-medium uppercase" style="width:200px">Description</th><th class="${d?'text-gray-300':'text-gray-700'} px-2 py-3 text-left text-xs font-medium uppercase" style="width:130px">Dest.</th><th class="${d?'text-gray-300':'text-gray-700'} px-2 py-3 text-left text-xs font-medium uppercase" style="width:130px">IP</th><th class="${d?'text-gray-300':'text-gray-700'} px-2 py-3 text-center text-xs font-medium uppercase" style="width:120px">Actions</th></tr></thead><tbody class="${d?'divide-gray-700':'divide-gray-200'} divide-y">${ports.map((p,i)=>`<tr class="${d?`hover:bg-gray-700/50 ${i%2===0?'bg-gray-800/30':'bg-gray-800/10'}`:`hover:bg-gray-50 ${i%2===0?'bg-gray-50/50':'bg-white'}`}"><td class="px-2 py-3"><div onclick="togglePort('${p.id}')" class="toggle-switch ${p.is_active?'bg-green-500':'bg-red-500'}"><div class="toggle-knob" style="transform:translateX(${p.is_active?'28px':'0'})"></div></div></td><td class="px-2 py-3"><div class="${d?'bg-blue-500/20 text-blue-400':'bg-blue-100 text-blue-700'} w-10 h-10 rounded-full flex items-center justify-center font-bold text-sm mx-auto">${getIcon(p.service)}</div></td><td class="${d?'text-white':'text-gray-900'} px-2 py-3 font-medium text-sm">${p.service}</td><td class="px-2 py-3"><code class="${d?'text-blue-400 bg-gray-900/50':'text-blue-600 bg-blue-50'} px-2 py-1 rounded text-xs">${p.port_internal}</code></td><td class="px-2 py-3"><code class="${d?'text-purple-400 bg-gray-900/50':'text-purple-600 bg-purple-50'} px-2 py-1 rounded text-xs">${p.port_external}</code></td><td class="px-2 py-3"><span class="${d?'bg-blue-500/20 text-blue-300':'bg-blue-100 text-blue-800'} px-2 py-1 rounded text-xs font-semibold">${p.protocol}</span></td><td class="${d?'text-gray-300':'text-gray-700'} px-2 py-3 text-sm">${p.description}</td><td class="${d?'text-gray-400':'text-gray-600'} px-2 py-3 text-sm">${p.destination||'-'}</td><td class="${d?'text-gray-400':'text-gray-600'} px-2 py-3 text-sm">${p.ip_address||'-'}</td><td class="px-2 py-3"><div class="flex gap-2 justify-center"><button onclick="alert2('Modifier ${p.service}')" class="action-btn ${d?'bg-blue-500/20 text-blue-400 hover:bg-blue-500/30':'bg-blue-100 text-blue-700 hover:bg-blue-200'}"><span class="w-6 h-6">${icons.edit}</span></button><button onclick="alert2('Supprimer ${p.service}')" class="action-btn ${d?'bg-red-500/20 text-red-400 hover:bg-red-500/30':'bg-red-100 text-red-700 hover:bg-red-200'}"><span class="w-6 h-6">${icons.trash}</span></button></div></td></tr>`).join('')}</tbody></table></div></div></div>`;}).join('');}
function renderDevices(sD,d){const si=k=>state.sortConfig.key===k?(state.sortConfig.direction==='asc'?' ↑':' ↓'):'';return`<div class="${d?'bg-gray-800/50 border-gray-700':'bg-white/80 border-gray-200'} rounded-lg shadow-xl overflow-hidden border"><div class="overflow-x-auto"><table class="w-full"><thead class="${d?'bg-gray-900/50':'bg-gray-100'}"><tr><th onclick="handleSort('hostname')" class="${d?'text-gray-300 hover:bg-gray-800':'text-gray-700 hover:bg-gray-200'} px-4 py-3 text-left text-xs font-medium uppercase" style="width:200px">Hostname${si('hostname')}</th><th onclick="handleSort('ip_address')" class="${d?'text-gray-300 hover:bg-gray-800':'text-gray-700 hover:bg-gray-200'} px-4 py-3 text-left text-xs font-medium uppercase" style="width:180px">IP/Masque${si('ip_address')}</th><th onclick="handleSort('mac_address')" class="${d?'text-gray-300 hover:bg-gray-800':'text-gray-700 hover:bg-gray-200'} px-4 py-3 text-left text-xs font-medium uppercase" style="width:160px">MAC${si('mac_address')}</th><th onclick="handleSort('device_type')" class="${d?'text-gray-300 hover:bg-gray-800':'text-gray-700 hover:bg-gray-200'} px-4 py-3 text-left text-xs font-medium uppercase" style="width:150px">Type${si('device_type')}</th><th onclick="handleSort('description')" class="${d?'text-gray-300 hover:bg-gray-800':'text-gray-700 hover:bg-gray-200'} px-4 py-3 text-left text-xs font-medium uppercase" style="min-width:200px">Description${si('description')}</th><th class="${d?'text-gray-300':'text-gray-700'} px-4 py-3 text-center text-xs font-medium uppercase" style="width:140px">Actions</th></tr></thead><tbody class="${d?'divide-gray-700':'divide-gray-200'} divide-y">${sD.length===0?`<tr><td colspan="6" class="${d?'text-gray-400':'text-gray-600'} px-4 py-8 text-center">Aucun périphérique</td></tr>`:sD.map((dev,i)=>`<tr class="${d?`hover:bg-gray-700/50 ${i%2===0?'bg-gray-800/30':'bg-gray-800/10'}`:`hover:bg-gray-300/50 ${i%2===0?'bg-gray-200/60':'bg-gray-100'}`}"><td class="${d?'text-white':'text-gray-900'} px-4 py-3 font-medium">${dev.hostname}</td><td class="px-4 py-3"><code class="${d?'text-blue-400 bg-gray-900/50':'text-blue-600 bg-blue-50'} px-2 py-1 rounded">${dev.ip_address}</code></td><td class="${d?'text-gray-400':'text-gray-600'} px-4 py-3 text-sm">${dev.mac_address||'-'}</td><td class="px-4 py-3"><span class="${d?'bg-purple-500/20 text-purple-300':'bg-purple-100 text-purple-800'} px-2 py-1 rounded text-xs font-semibold">${dev.device_type}</span></td><td class="${d?'text-gray-400':'text-gray-600'} px-4 py-3 text-sm">${dev.description||'-'}</td><td class="px-4 py-3"><div class="flex gap-2 justify-center"><button onclick="alert2('Modifier ${dev.hostname}')" class="action-btn ${d?'bg-blue-500/20 text-blue-400 hover:bg-blue-500/30':'bg-blue-100 text-blue-700 hover:bg-blue-200'}"><span class="w-6 h-6">${icons.edit}</span></button><button onclick="alert2('Supprimer ${dev.hostname}')" class="action-btn ${d?'bg-red-500/20 text-red-400 hover:bg-red-500/30':'bg-red-100 text-red-700 hover:bg-red-200'}"><span class="w-6 h-6">${icons.trash}</span></button></div></td></tr>`).join('')}</tbody></table></div></div>`;}
render();
</script>
