// Fonction de tri
function sortArray(array, key, direction) {
    if (!key) return array;
    return [...array].sort((a, b) => {
        let aVal = a[key] || '';
        let bVal = b[key] || '';
        
        if (key === 'ip_address') {
            const ipToNum = (ip) => {
                const parts = (ip || '0.0.0.0').split('/')[0].split('.');
                return parts.reduce((acc, oct, idx) => acc + (parseInt(oct) || 0) * Math.pow(256, 3 - idx), 0);
            };
            aVal = ipToNum(aVal);
            bVal = ipToNum(bVal);
        } else {
            aVal = String(aVal).toLowerCase();
            bVal = String(bVal).toLowerCase();
        }
        
        if (aVal < bVal) return direction === 'asc' ? -1 : 1;
        if (aVal > bVal) return direction === 'asc' ? 1 : -1;
        return 0;
    });
}

    });
    downloadFile(csv, 'pfsense_ports.csv', 'text/csv');
}

function exportDevicesCSV() {
    let csv = "Hostname,Adresse IP,Adresse MAC,Type,Description\n";
    state.devices.forEach(d => {
        csv += `"${d.hostname}","${d.ip_address}","${d.mac_address || ''}","${d.device_type}","${d.description || ''}"\n`;
    });
    downloadFile(csv, 'parc_informatique.csv', 'text/csv');
}

function downloadFile(content, filename, type) {
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

        const ports = groupedPorts[category];
        
        return `
            <div class="mb-8">
                <div class="bg-gradient-to-r ${gradient} rounded-lg p-4 mb-4 shadow-xl">
                    <h2 class="text-2xl font-bold text-white flex items-center gap-3">
                        ${category}
                        <span class="text-sm font-normal opacity-80">(${ports.length} règles)</span>
                    </h2>
                </div>
                
                <div class="${isDark ? 'bg-gray-800/50 border-gray-700' : 'bg-gray-200/90 border-gray-400'} backdrop-blur-lg rounded-lg shadow-xl overflow-hidden border">
                    <div class="overflow-x-auto">
                        <table class="w-full">
                            <thead class="${isDark ? 'bg-gray-900/50' : 'bg-gray-100'}">
                                <tr>
                                    <th class="${isDark ? 'text-gray-300' : 'text-gray-700'} px-2 py-3 text-left text-xs font-medium uppercase tracking-wider" style="width:75px">État</th>
                                    <th class="${isDark ? 'text-gray-300' : 'text-gray-700'} px-2 py-3 text-left text-xs font-medium uppercase tracking-wider" style="width:170px">Service</th>
                                    <th class="${isDark ? 'text-gray-300' : 'text-gray-700'} px-2 py-3 text-left text-xs font-medium uppercase tracking-wider" style="width:110px">Port Interne</th>
                                    <th class="${isDark ? 'text-gray-300' : 'text-gray-700'} px-2 py-3 text-left text-xs font-medium uppercase tracking-wider" style="width:110px">Port Externe</th>
                                    <th class="${isDark ? 'text-gray-300' : 'text-gray-700'} px-2 py-3 text-left text-xs font-medium uppercase tracking-wider" style="width:85px">Protocole</th>
                                    <th class="${isDark ? 'text-gray-300' : 'text-gray-700'} px-2 py-3 text-left text-xs font-medium uppercase tracking-wider" style="width:220px">Description</th>
                                    <th class="${isDark ? 'text-gray-300' : 'text-gray-700'} px-2 py-3 text-left text-xs font-medium uppercase tracking-wider" style="width:130px">Destination</th>
                                    <th class="${isDark ? 'text-gray-300' : 'text-gray-700'} px-2 py-3 text-left text-xs font-medium uppercase tracking-wider" style="width:140px">IP</th>
                                    <th class="${isDark ? 'text-gray-300' : 'text-gray-700'} px-2 py-3 text-center text-xs font-medium uppercase tracking-wider" style="width:100px">Actions</th>
                                </tr>
                            </thead>
                            <tbody class="${isDark ? 'divide-gray-700' : 'divide-gray-200'} divide-y">
                                ${ports.map((port, idx) => `
                                    <tr class="${isDark ? `hover:bg-gray-700/50 ${idx % 2 === 0 ? 'bg-gray-800/30' : 'bg-gray-800/10'}` : `hover:bg-gray-50 ${idx % 2 === 0 ? 'bg-gray-50/50' : 'bg-white'}`} transition-colors">
                                        <td class="px-2 py-3">
                                            <div onclick="togglePortStatus('${port.id}')" class="toggle-switch ${port.is_active ? 'bg-green-500' : 'bg-red-500'}">
                                                <div class="toggle-knob" style="transform: translateX(${port.is_active ? '28px' : '0'})"></div>
                                            </div>
                                        </td>
                                        <td class="${isDark ? 'text-white' : 'text-gray-900'} px-2 py-3 font-medium text-sm truncate">${port.service}</td>
                                        <td class="px-2 py-3">
                                            <code class="${isDark ? 'text-blue-400 bg-gray-900/50' : 'text-blue-600 bg-blue-50'} px-1 py-1 rounded text-xs">${port.port_internal}</code>
                                        </td>
                                        <td class="px-2 py-3">
                                            <code class="${isDark ? 'text-purple-400 bg-gray-900/50' : 'text-purple-600 bg-purple-50'} px-1 py-1 rounded text-xs">${port.port_external}</code>
                                        </td>
                                        <td class="px-2 py-3">
                                            <span class="${isDark ? 'bg-blue-500/20 text-blue-300' : 'bg-blue-100 text-blue-800'} px-1 py-1 rounded text-xs font-semibold">${port.protocol}</span>
                                        </td>
                                        <td class="${isDark ? 'text-gray-300' : 'text-gray-700'} px-2 py-3 text-sm truncate">${port.description}</td>
                                        <td class="${isDark ? 'text-gray-400' : 'text-gray-600'} px-2 py-3 text-sm truncate">${port.destination || '-'}</td>
                                        <td class="${isDark ? 'text-gray-400' : 'text-gray-600'} px-2 py-3 text-sm truncate">${port.ip_address || '-'}</td>
                                        <td class="px-2 py-3">
                                            <div class="flex gap-2 justify-center">
                                                <button class="action-btn ${isDark ? 'bg-blue-500/20 text-blue-400 hover:bg-blue-500/30' : 'bg-blue-100 text-blue-700 hover:bg-blue-200'}" title="Modifier (lecture seule)">
                                                    <span class="w-6 h-6">${icons.edit}</span>
                                                </button>
                                                <button class="action-btn ${isDark ? 'bg-red-500/20 text-red-400 hover:bg-red-500/30' : 'bg-red-100 text-red-700 hover:bg-red-200'}" title="Supprimer (lecture seule)">
                                                    <span class="w-6 h-6">${icons.trash}</span>
                                                </button>
                                            </div>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        `;
    }).join('');
}

function renderDevicesTab(sortedDevices, isDark) {
    const sortIcon = (key) => {
        if (state.sortConfig.key === key) {
            return state.sortConfig.direction === 'asc' ? ' ↑' : ' ↓';
        }
        return '';
    };
    
    return `
        <div class="${isDark ? 'bg-gray-800/50 border-gray-700' : 'bg-white/80 border-gray-200'} backdrop-blur-lg rounded-lg shadow-xl overflow-hidden border">
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="${isDark ? 'bg-gray-900/50' : 'bg-gray-100'}">
                        <tr>
                            <th onclick="handleSort('hostname')" class="${isDark ? 'text-gray-300 hover:bg-gray-800' : 'text-gray-700 hover:bg-gray-200'} px-4 py-3 text-left text-xs font-medium uppercase tracking-wider transition-colors" style="width:200px">
                                Hostname${sortIcon('hostname')}
                            </th>
                            <th onclick="handleSort('ip_address')" class="${isDark ? 'text-gray-300 hover:bg-gray-800' : 'text-gray-700 hover:bg-gray-200'} px-4 py-3 text-left text-xs font-medium uppercase tracking-wider transition-colors" style="width:180px">
                                Adresse IP/Masque${sortIcon('ip_address')}
                            </th>
                            <th onclick="handleSort('mac_address')" class="${isDark ? 'text-gray-300 hover:bg-gray-800' : 'text-gray-700 hover:bg-gray-200'} px-4 py-3 text-left text-xs font-medium uppercase tracking-wider transition-colors" style="width:160px">
                                Adresse MAC${sortIcon('mac_address')}
                            </th>
                            <th onclick="handleSort('device_type')" class="${isDark ? 'text-gray-300 hover:bg-gray-800' : 'text-gray-700 hover:bg-gray-200'} px-4 py-3 text-left text-xs font-medium uppercase tracking-wider transition-colors" style="width:150px">
                                Type${sortIcon('device_type')}
                            </th>
                            <th onclick="handleSort('description')" class="${isDark ? 'text-gray-300 hover:bg-gray-800' : 'text-gray-700 hover:bg-gray-200'} px-4 py-3 text-left text-xs font-medium uppercase tracking-wider transition-colors" style="min-width:200px">
                                Description${sortIcon('description')}
                            </th>
                            <th class="${isDark ? 'text-gray-300' : 'text-gray-700'} px-4 py-3 text-center text-xs font-medium uppercase tracking-wider" style="width:140px">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="${isDark ? 'divide-gray-700' : 'divide-gray-200'} divide-y">
                        ${sortedDevices.length === 0 ? `
                            <tr>
                                <td colspan="6" class="${isDark ? 'text-gray-400' : 'text-gray-600'} px-4 py-8 text-center">
                                    Aucun périphérique enregistré.
                                </td>
                            </tr>
                        ` : sortedDevices.map((device, idx) => `
                            <tr class="${isDark ? `hover:bg-gray-700/50 ${idx % 2 === 0 ? 'bg-gray-800/30' : 'bg-gray-800/10'}` : `hover:bg-gray-300/50 ${idx % 2 === 0 ? 'bg-gray-200/60' : 'bg-gray-100'}`} transition-colors">
                                <td class="${isDark ? 'text-white' : 'text-gray-900'} px-4 py-3 font-medium">${device.hostname}</td>
                                <td class="px-4 py-3">
                                    <code class="${isDark ? 'text-blue-400 bg-gray-900/50' : 'text-blue-600 bg-blue-50'} px-2 py-1 rounded">${device.ip_address}</code>
                                </td>
                                <td class="${isDark ? 'text-gray-400' : 'text-gray-600'} px-4 py-3 text-sm">${device.mac_address || '-'}</td>
                                <td class="px-4 py-3">
                                    <span class="${isDark ? 'bg-purple-500/20 text-purple-300' : 'bg-purple-100 text-purple-800'} px-2 py-1 rounded text-xs font-semibold">${device.device_type}</span>
                                </td>
                                <td class="${isDark ? 'text-gray-400' : 'text-gray-600'} px-4 py-3 text-sm">${device.description || '-'}</td>
                                <td class="px-4 py-3">
                                    <div class="flex gap-2 justify-center">
                                        <button class="action-btn ${isDark ? 'bg-blue-500/20 text-blue-400 hover:bg-blue-500/30' : 'bg-blue-100 text-blue-700 hover:bg-blue-200'}" title="Modifier (lecture seule)">
                                            <span class="w-6 h-6">${icons.edit}</span>
                                        </button>
                                        <button class="action-btn ${isDark ? 'bg-red-500/20 text-red-400 hover:bg-red-500/30' : 'bg-red-100 text-red-700 hover:bg-red-200'}" title="Supprimer (lecture seule)">
                                            <span class="w-6 h-6">${icons.trash}</span>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        </div>
    `;
}

// Initialisation
render();
</script>

</body>
</html>
